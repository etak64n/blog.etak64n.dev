name: Lockfile

# Resolves pnpm-lock.yaml on the runner, so nothing has to be installed on a local machine.
# Run it by hand after changing package.json, then download the artifact and commit the file.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve the lockfile
        run: pnpm install --lockfile-only
      - uses: actions/upload-artifact@v7
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
