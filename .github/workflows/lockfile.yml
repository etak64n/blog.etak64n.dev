# Temporary: writes package-lock.json for the new dependencies on a runner (nothing is installed
# on the author's Mac). Removed in the commit that adds the lockfile.
name: Lockfile
on:
  push:
    branches: [browser-editor]
    paths: [package.json, .github/workflows/lockfile.yml]
jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
