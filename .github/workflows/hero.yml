name: Hero image generation
run-name: "Hero image • ${{ inputs.slug || 'hello-astro' }} #${{ github.run_number }}"

# Draws a hero image with Workers AI through `npm run hero`, the same command used to write posts,
# and checks the result. Runs when the command or this workflow changes in a pull request, and on
# demand (Actions → Hero image generation → Run workflow) for any post. The image is uploaded as an
# artifact to look at; nothing is committed.
on:
  pull_request:
    paths:
      - scripts/hero.ts
      - .github/workflows/hero.yml
  workflow_dispatch:
    inputs:
      slug:
        description: Slug of the post to draw the hero image for
        required: true
        default: hello-astro

concurrency:
  group: hero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    # Pull requests from forks get no secrets.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      SLUG: ${{ inputs.slug || 'hello-astro' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the hero image
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # An API token with the Workers AI Read and Write permissions only.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: npm run hero -- "$SLUG"

      - name: Check the image and the front matter
        run: |
          node -e '
            const sharp = require("sharp");
            sharp(process.argv[1]).metadata().then((m) => {
              console.log(`${m.format} ${m.width}x${m.height}`);
              if (m.format !== "webp" || m.width !== 1200 || m.height !== 630) process.exit(1);
            });
          ' "src/content/blog/$SLUG/hero.webp"
          grep -qx 'hero: ./hero.webp' "src/content/blog/$SLUG/$SLUG.md"
          npx astro sync

      - uses: actions/upload-artifact@v7
        with:
          name: hero-${{ env.SLUG }}
          path: src/content/blog/${{ env.SLUG }}/hero.webp
          if-no-files-found: error
          retention-days: 14
