name: Deploy

# Publishes the site to the Worker blog-etak64n-dev. The emdash branch deploys too until the site
# moves to blog.etak64n.dev; the type check only reports, so it never holds back a deploy.
on:
  push:
    branches: [main, emdash]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  # Never cancel a run halfway through a deploy.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
        continue-on-error: true
      # cf runs `astro build` and uploads the result, as cloudflare.config.ts describes.
      - name: Build and deploy
        run: pnpm exec cf deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
