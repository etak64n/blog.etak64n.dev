name: Build and deploy
run-name: "Astro → CF Pages • ${{ github.head_ref || github.ref_name }} #${{ github.run_number }}"

# main → production (https://blog.etak64n.dev). Pull requests → a preview deployment at
# https://<branch>.etak64n-blog.pages.dev that also shows draft posts.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_PAGES_PROJECT: etak64n-blog
  PRODUCTION_URL: https://blog.etak64n.dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Astro's content store and optimized images. Changes to the Markdown pipeline or the schema
      # start from an empty cache, because rendered posts are reused when only their files are
      # unchanged.
      - name: Restore Astro cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: astro-${{ hashFiles('package-lock.json', 'astro.config.ts', 'ec.config.mjs', 'src/content.config.ts', 'src/tags.ts', 'src/site.ts', 'src/markdown/**') }}-${{ github.sha }}
          restore-keys: astro-${{ hashFiles('package-lock.json', 'astro.config.ts', 'ec.config.mjs', 'src/content.config.ts', 'src/tags.ts', 'src/site.ts', 'src/markdown/**') }}-

      - name: Check types and content
        run: npm run check

      - name: Build
        run: npm run build
        env:
          SHOW_DRAFTS: ${{ github.event_name == 'pull_request' }}

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      # wrangler.toml names the Pages project and the output directory.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action installs Wrangler into the checkout, which leaves it modified (--commit-dirty).
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: echo "Deployed to ${URL}" >> "$GITHUB_STEP_SUMMARY"

  # One Discord message per run.
  notify:
    needs: [build, deploy]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_RES: ${{ needs.build.result }}
          DEPLOY_RES: ${{ needs.deploy.result }}
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "$(printf '%s' "${DISCORD_WEBHOOK_URL:-}" | tr -d '[:space:]')" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not set. Configure it in Settings → Secrets and variables → Actions."
            exit 1
          fi

          case "$BUILD_RES" in success) BUILD_TEXT="Success" ;; failure) BUILD_TEXT="Failed" ;; *) BUILD_TEXT="$BUILD_RES" ;; esac
          case "$DEPLOY_RES" in
            success) DEPLOY_TEXT="Success" ;;
            failure) DEPLOY_TEXT="Failed" ;;
            *) DEPLOY_TEXT="Skipped" ;;
          esac

          # Colour of the embed: the worst result wins.
          if   [ "$BUILD_RES"  = "failure" ]; then COLOR=15158332
          elif [ "$DEPLOY_RES" = "failure" ]; then COLOR=15105570
          elif [ "$BUILD_RES" != "success" ] || [ "$DEPLOY_RES" != "success" ]; then COLOR=16705372
          else COLOR=3066993; fi

          SUBJECT="${HEAD_MSG:-Workflow summary}"
          [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_TITLE:-}" ] && SUBJECT="$PR_TITLE"
          SUBJECT=$(printf '%s' "$SUBJECT" | tr -d '\r' | head -n1 | cut -c1-120)

          SITE_URL="$PRODUCTION_URL"
          [ "$EVENT_NAME" = "pull_request" ] && [ -n "${DEPLOY_URL:-}" ] && SITE_URL="$DEPLOY_URL"

          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          RUN_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${REPO_URL}/commit/${GITHUB_SHA}"
          SPACER=$'​'

          jq -n \
            --arg title "Astro → CF Pages • ${BRANCH} #${GITHUB_RUN_NUMBER}" \
            --arg run_url "$RUN_URL" --arg subject "$SUBJECT" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repo "$GITHUB_REPOSITORY" --arg repo_url "$REPO_URL" \
            --arg branch "$BRANCH" --arg branch_url "${REPO_URL}/tree/${BRANCH}" \
            --arg short_sha "${GITHUB_SHA::7}" --arg commit_url "$COMMIT_URL" \
            --arg actor "$ACTOR" --arg actor_url "https://github.com/${ACTOR}" \
            --arg build_text "$BUILD_TEXT" --arg deploy_text "$DEPLOY_TEXT" \
            --arg run_number "$GITHUB_RUN_NUMBER" --arg spacer "$SPACER" \
            --arg site_url "$SITE_URL" --argjson color "$COLOR" \
            '{
              username: "GitHub Actions",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              allowed_mentions: {parse: []},
              embeds: [{
                title: $title, url: $run_url, description: $subject,
                color: $color, timestamp: $now,
                author: {name: $repo, url: $repo_url},
                fields: [
                  {name: "Build",  value: $build_text,  inline: true},
                  {name: "Deploy", value: $deploy_text, inline: true},
                  {name: $spacer,  value: $spacer,      inline: true},
                  {name: "Branch", value: ("[" + $branch + "](" + $branch_url + ")"), inline: true},
                  {name: "Commit", value: ("[" + $short_sha + "](" + $commit_url + ")"), inline: true},
                  {name: $spacer,  value: $spacer, inline: true},
                  {name: "Actor",  value: ("[" + $actor + "](" + $actor_url + ")"), inline: true},
                  {name: "Site",   value: $site_url, inline: true},
                  {name: $spacer,  value: $spacer, inline: true}
                ],
                footer: {text: ("Run #" + $run_number)}
              }],
              components: [{
                type: 1,
                components: [
                  {type: 2, style: 5, label: "Open Run",    url: $run_url},
                  {type: 2, style: 5, label: "View Commit", url: $commit_url},
                  {type: 2, style: 5, label: "View Site",   url: $site_url}
                ]
              }]
            }' > payload.json

          code=$(curl -sS -o resp.json -w "%{http_code}" -H 'Content-Type: application/json' -d @payload.json "$DISCORD_WEBHOOK_URL")
          echo "Discord HTTP: $code"
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::Discord webhook error (HTTP $code)"
            cat resp.json || true
            exit 1
          fi
